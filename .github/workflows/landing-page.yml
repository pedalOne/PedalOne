name: Deploy PedalOne landing page

on:
  push:
    branches: [main]
    paths:
      - 'landing-page/dist/**'
      - '.github/workflows/landing-page.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate static site
        run: |
          test -f landing-page/dist/index.html
          test -f landing-page/dist/style.css
          node --check landing-page/dist/app.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload landing page only
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing-page/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
